---
# TE-27603 dev test payload: hybrid (auto-split x matrix.os), remote discovery. Real Selenium/TestNG
# run; Test_3 fails deterministically on every OS (assertion in Test3.java on this branch).
version: 0.1

# the jp10 project 'te27603-rerun' (linked to this repo) — rerun needs a project with a repository
project:
  id: 01M2T0G3N9RV28DEJNHKZ8TY51
  name: te27603-rerun
  type: custom

runson: ${matrix.os}

matrix:
  os: [linux, win]

runtime:
  language: java
  version: 11

cacheKey: '{{ checksum "pom.xml" }}'
cacheDirectories:
  - .m2

pre:
  - mvn -Dmaven.repo.local=./.m2 dependency:resolve

autosplit: true
concurrency: 2
parallelism: 2

testDiscovery:
  type: raw
  mode: remote
  command: grep 'test name' xml/testng_linux.xml | awk '{print $2}' | sed 's/name=//g' | sed 's/>//g' | sed 's/^[ \t]*//'

testRunnerCommand: mvn test "-Dplatname=${matrix.os}" "-Dmaven.repo.local=./.m2" "-DselectedTests=$test"

retryOnFailure: false
report: false

jobLabel: [te-27603, remote, hybrid]
