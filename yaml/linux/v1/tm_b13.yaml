---
# TE-27603 test matrix case b13: hybrid remote os[linux,win], Test_3 fails on linux only → subset narrowed to linux
version: 0.1
project:
  id: 01M3478KB23C0NPEXB0SADMB4T
  name: te27603-rerun
  type: custom
runson: ${matrix.os}
matrix:
  os: [linux, win]
runtime:
  language: java
  version: 11
cacheKey: '{{ checksum "pom.xml" }}'
cacheDirectories:
  - .m2
pre:
  - mvn -Dmaven.repo.local=./.m2 dependency:resolve
retryOnFailure: false
report: false
env:
  LT_HUB_HOST: stage-hub.lambdatestinternal.com
autosplit: true
concurrency: 2
parallelism: 2
testDiscovery:
  type: raw
  mode: remote
  command: printf 'Test_1\nTest_3\nTest_2\nTest_4\n'
testRunnerCommand: mvn test "-Dplatname=linux" "-Dmaven.repo.local=./.m2" "-DselectedTests=$test"
jobLabel: [te-27603, tm, b13]
