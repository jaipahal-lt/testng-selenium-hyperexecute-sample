---
# TE-27603 test matrix case B19b: hybrid whose OSes run GENUINELY different runner commands
# (linux selects by name, win adds -Dbrowser=edge so Test_1 fails there). Failures on both
# OSes, so the converted (matrix) form — a single testSuites entry — cannot express it and the
# job must keep the OS-wise grouped route, each leg resolving its own command.
version: 0.1
project:
  id: 01M3478KB23C0NPEXB0SADMB4T
  name: te27603-rerun
  type: custom
runson: ${matrix.os}
matrix:
  os: [linux, win]
runtime:
  language: java
  version: 11
cacheKey: '{{ checksum "pom.xml" }}'
cacheDirectories:
  - .m2
pre:
  - mvn -Dmaven.repo.local=./.m2 dependency:resolve
autosplit: true
concurrency: 2
parallelism: 2
retryOnFailure: false
report: false
testDiscovery:
  type: raw
  mode: remote
  command: printf 'Test_3\n'
linuxTestRunnerCommand: mvn test "-Dplatname=linux" "-Dmaven.repo.local=./.m2" "-DselectedTests=$test"
winTestRunnerCommand: mvn test "-Dplatname=linux" "-Dmaven.repo.local=./.m2" "-DselectedTests=$test" "-Dbrowser=edge"
jobLabel: [te-27603, tm, b19b]
env:
  LT_HUB_HOST: stage-hub.lambdatestinternal.com
