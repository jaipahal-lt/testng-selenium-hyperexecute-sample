  - .m2
pre:
  - mvn -Dmaven.repo.local=./.m2 dependency:resolve
retryOnFailure: false
report: false
env:
  LT_HUB_HOST: stage-hub.lambdatestinternal.com
testSuites:
  - mvn test "-Dplatname=linux" "-Dmaven.repo.local=./.m2" "-DselectedTests=Test_3"
jobLabel: [te-27603, tm, b22]
