---
# TE-27603 test matrix case C11: hybrid with an unmapped OS (win11 → allocation fails) beside a real failure
version: 0.1
project:
  id: 01M2T0G3N9RV28DEJNHKZ8TY51
  name: te27603-rerun
  type: custom
runson: ${matrix.os}
matrix:
  os: [linux, win11]
runtime:
  language: java
  version: 11
cacheKey: '{{ checksum "pom.xml" }}'
cacheDirectories:
  - .m2
pre:
  - mvn -Dmaven.repo.local=./.m2 dependency:resolve
retryOnFailure: false
report: false
env:
  LT_HUB_HOST: stage-hub.lambdatestinternal.com
autosplit: true
concurrency: 1
parallelism: 1
testDiscovery:
  type: raw
  mode: remote
  command: printf 'Test_3\nTest_2\nTest_4\n'
testRunnerCommand: mvn test "-Dplatname=linux" "-Dmaven.repo.local=./.m2" "-DselectedTests=$test"
jobLabel: [te-27603, tm, c11]
