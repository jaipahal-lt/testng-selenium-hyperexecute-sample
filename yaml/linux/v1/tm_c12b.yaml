---
# TE-27603 test matrix case C12b: testSuiteTimeout trips on a sleeping scenario beside a real failure
version: 0.1
project:
  id: 01M2T0G3N9RV28DEJNHKZ8TY51
  name: te27603-rerun
  type: custom
runson: linux
testSuiteTimeout: 1
runtime:
  language: java
  version: 11
cacheKey: '{{ checksum "pom.xml" }}'
cacheDirectories:
  - .m2
pre:
  - mvn -Dmaven.repo.local=./.m2 dependency:resolve
retryOnFailure: false
report: false
env:
  LT_HUB_HOST: stage-hub.lambdatestinternal.com
autosplit: true
concurrency: 1
testDiscovery:
  type: raw
  mode: remote
  command: printf 'Test_3\nTest_5\n'
testRunnerCommand: mvn test "-Dplatname=tm" "-Dmaven.repo.local=./.m2" "-DselectedTests=$test" "-DtmMode=sleep" "-DtmSleep=150"
jobLabel: [te-27603, tm, c12b]
