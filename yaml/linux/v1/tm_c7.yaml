---
# TE-27603 test matrix case C7/C8: retryOnFailure: flaky Test_5 passes on retry, Test_3 fails again
version: 0.1
project:
  id: 01M2T0G3N9RV28DEJNHKZ8TY51
  name: te27603-rerun
  type: custom
runson: linux
runtime:
  language: java
  version: 11
cacheKey: '{{ checksum "pom.xml" }}'
cacheDirectories:
  - .m2
pre:
  - mvn -Dmaven.repo.local=./.m2 dependency:resolve
retryOnFailure: true
maxRetries: 1
report: false
env:
  LT_HUB_HOST: stage-hub.lambdatestinternal.com
autosplit: true
concurrency: 2
testDiscovery:
  type: raw
  mode: remote
  command: printf 'Test_5\nTest_3\n'
testRunnerCommand: mvn test "-Dplatname=tm" "-Dmaven.repo.local=./.m2" "-DselectedTests=$test" "-DtmMode=flaky"
jobLabel: [te-27603, tm, c7]
